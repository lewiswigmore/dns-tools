{% extends 'base.html' %}
{% import 'components.html' as ui %}
{% set active_page='resources' %}
{% block title %}Content Library - DNSTools{% endblock %}
{% block content %}
<div x-data="ResourcesPage()" class="space-y-4">
  
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-[#c9d1d9]">Content Library</h2>
      <p class="text-xs text-[#8b949e]">Reference guide and educational materials</p>
    </div>
    
    <div class="flex flex-col md:flex-row md:items-center gap-3">
        <!-- Search -->
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-[#8b949e] text-xs"></i>
            <input type="text" 
                   x-model="searchQuery" 
                   placeholder="Search library..." 
                   class="bg-[#0d1117] border border-[#30363d] text-[#c9d1d9] text-xs rounded-md py-1.5 pl-8 pr-3 focus:ring-1 focus:ring-[#58a6ff] focus:border-[#58a6ff] placeholder-[#484f58] w-full md:w-48">
        </div>

        <!-- Complexity Filter -->
        <div class="flex bg-[#161b22] rounded-lg p-1 border border-[#30363d] overflow-x-auto no-scrollbar">
            <div class="flex min-w-max">
                <button @click="complexityFilter = 'All'" 
                        :class="complexityFilter === 'All' ? 'bg-[#238636] text-white' : 'text-[#8b949e] hover:text-[#c9d1d9]'"
                        class="px-3 py-1 rounded text-xs font-medium transition-colors">All</button>
                <button @click="complexityFilter = 'Beginner'" 
                        :class="complexityFilter === 'Beginner' ? 'bg-[#1f6feb] text-white' : 'text-[#8b949e] hover:text-[#c9d1d9]'"
                        class="px-3 py-1 rounded text-xs font-medium transition-colors">Beginner</button>
                <button @click="complexityFilter = 'Intermediate'" 
                        :class="complexityFilter === 'Intermediate' ? 'bg-[#d29922] text-white' : 'text-[#8b949e] hover:text-[#c9d1d9]'"
                        class="px-3 py-1 rounded text-xs font-medium transition-colors">Intermediate</button>
                <button @click="complexityFilter = 'Advanced'" 
                        :class="complexityFilter === 'Advanced' ? 'bg-[#f85149] text-white' : 'text-[#8b949e] hover:text-[#c9d1d9]'"
                        class="px-3 py-1 rounded text-xs font-medium transition-colors">Advanced</button>
            </div>
        </div>
    </div>
  </div>

  <!-- Concepts Grid -->
  <div class="panel p-4 rounded-xl space-y-3" x-show="filteredKnowledgeBase.length > 0">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
      <template x-for="item in filteredKnowledgeBase" :key="item.id">
        <div @click="showConcept(item.title)" 
             class="panel p-3 rounded-lg concept-container cursor-pointer hover:border-[#58a6ff] transition-colors border border-[#30363d]"
             :class="conceptAnimations[item.title] ? 'concept-pulse' : ''">
            <div class="flex justify-between items-start mb-2">
                <h4 class="font-semibold text-[#c9d1d9] flex items-center text-sm">
                    <i :class="item.icon + ' ' + item.iconColor" class="mr-2"></i>
                    <span x-text="item.title"></span>
                </h4>
                <span class="text-[10px] px-1.5 py-0.5 rounded border"
                      :class="{
                        'border-blue-500/30 text-blue-400 bg-blue-500/10': item.complexity === 'Beginner',
                        'border-yellow-500/30 text-yellow-400 bg-yellow-500/10': item.complexity === 'Intermediate',
                        'border-red-500/30 text-red-400 bg-red-500/10': item.complexity === 'Advanced'
                      }"
                      x-text="item.complexity"></span>
            </div>
            <p class="text-[#8b949e] mb-2 text-xs line-clamp-2" x-text="item.summary"></p>
            <div class="flex flex-wrap gap-1 mt-2">
                <template x-for="tag in item.tags" :key="tag">
                    <span class="text-[10px] bg-[#21262d] text-[#8b949e] px-1.5 py-0.5 rounded border border-[#30363d]" x-text="tag"></span>
                </template>
            </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Use the concept modal component -->
  {{ ui.concept_modal() }}
</div>
{% endblock %}
