name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Run JavaScript tests
      run: node --experimental-default-type=module --test

    - name: Build UI SDK and static site
      run: |
        npm ci
        npm run build
        python generate_static.py

    - name: Verify published SDK asset
      run: |
        python -c "from pathlib import Path; source = Path('static/js/ui-sdk.bundle.js').read_bytes(); assert source; assert Path('dist/static/js/ui-sdk.bundle.js').read_bytes() == source; assert 'static/js/ui-sdk.bundle.js' in Path('dist/dashboard.html').read_text()"
